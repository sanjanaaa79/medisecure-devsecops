apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisecure-deployment
  labels:
    app: medisecure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medisecure
  template:
    metadata:
      labels:
        app: medisecure
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: medisecure-app
        image: medisecure:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: APP_ENV
          value: "production"
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
